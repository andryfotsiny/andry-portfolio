name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */3 * *"  # toutes les 3 jours à 8h UTC
  workflow_dispatch:         # permet de lancer manuellement

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DB via API
        run: |
          curl -f https://andry-portfolio.vercel.app/api/keepalive \
            || echo "Ping failed"